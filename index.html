<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MyTempo · 节拍器</title>
<style>
  :root {
    --bg: #121216;
    --card: #1d1d24;
    --text: #f2f2f5;
    --muted: #9a9aa5;
    --accent: #ff9500;
    --dot: #3a3a44;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .container {
    width: 100%;
    max-width: 430px;
    padding: 24px 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    text-align: center;
    margin: 0;
    letter-spacing: 0.5px;
  }
  h1 span { color: var(--accent); }

  /* 视觉节拍灯珠 */
  .dots {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 14px;
    height: 40px;
  }
  .dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--dot);
    transition: background 0.08s ease;
    position: relative;
  }
  .dot.downbeat::after {
    content: "";
    position: absolute; inset: -4px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,149,0,0.7);
  }
  .dot.active { background: var(--accent); }

  /* 速度 */
  .tempo { text-align: center; }
  .bpm-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
  }
  .bpm {
    font-size: 76px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .bpm-unit { color: var(--muted); font-size: 18px; }
  .tempo-btns {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
  }
  .round {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: none;
    background: var(--card);
    color: var(--text);
    font-size: 24px;
    font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .round:active { background: #2a2a34; }
  .tap {
    border: none; background: none;
    color: var(--accent);
    font-size: 16px; font-weight: 600;
    cursor: pointer; padding: 8px 12px;
  }

  /* 速度模式切换 */
  .mode-switch {
    display: flex;
    background: var(--card);
    border-radius: 20px;
    padding: 4px;
    margin: 0 auto 12px;
    width: fit-content;
  }
  .mode-btn {
    border: none; background: none;
    color: var(--muted);
    font-size: 14px; font-weight: 600;
    padding: 6px 18px;
    border-radius: 16px;
    cursor: pointer;
  }
  .mode-btn.selected { background: var(--accent); color: #fff; }
  .input-wrap {
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .input-wrap input[type="number"] {
    width: 150px;
    background: var(--card);
    border: none;
    border-radius: 12px;
    color: var(--text);
    font-size: 30px; font-weight: 700;
    text-align: center;
    padding: 12px 8px;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .input-wrap input[type="number"]:focus { outline: 2px solid var(--accent); }
  .input-wrap input[type="number"]::-webkit-outer-spin-button,
  .input-wrap input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

  /* 分区标题 */
  .label { font-size: 13px; color: var(--muted); margin-bottom: 10px; }

  /* 节拍型 chips */
  .chips {
    display: flex; gap: 10px;
    overflow-x: auto;
    padding: 4px 0;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    padding: 9px 16px;
    border-radius: 20px;
    border: none;
    background: var(--card);
    color: var(--text);
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
  }
  .chip.selected { background: var(--accent); color: #fff; }

  /* 音效分段 */
  .seg {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    background: var(--card);
    border-radius: 12px;
    padding: 5px;
  }
  .seg button {
    border: none; background: none;
    color: var(--muted);
    padding: 9px 0;
    font-size: 15px;
    border-radius: 8px;
    cursor: pointer;
  }
  .seg button.selected { background: var(--accent); color: #fff; }

  /* 开关与音量 */
  .options { display: flex; flex-direction: column; gap: 18px; }
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
  }
  .toggle-row span { font-size: 16px; }
  .volume-row { display: flex; align-items: center; gap: 12px; }
  .volume-row svg { flex: 0 0 auto; }
  .vol-label { flex: 0 0 auto; min-width: 44px; text-align: right; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* 滑块 */
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px;
    border-radius: 3px;
    background: var(--card);
    outline: none;
    accent-color: var(--accent);
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }

  /* iOS 风格开关 */
  .switch { position: relative; width: 52px; height: 32px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .track {
    position: absolute; inset: 0;
    border-radius: 16px;
    background: var(--dot);
    transition: background 0.2s;
  }
  .switch .track::before {
    content: "";
    position: absolute;
    left: 4px; top: 4px;
    width: 24px; height: 24px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.2s;
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::before { transform: translateX(20px); }

  /* 播放按钮 */
  .play-wrap { display: flex; justify-content: center; }
  .play {
    width: 92px; height: 92px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 24px rgba(255,149,0,0.35);
  }
  .play:active { transform: scale(0.96); }
  .play .icon { font-size: 40px; line-height: 1; }
  .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <h1>MyTempo <span>节拍器</span></h1>

  <!-- 视觉节拍 -->
  <div class="dots" id="dots"></div>

  <!-- 速度 -->
  <div class="tempo">
    <div class="mode-switch">
      <button class="mode-btn selected" id="modeSlider">滑块</button>
      <button class="mode-btn" id="modeInput">手动输入</button>
    </div>
    <div class="bpm-row">
      <span class="bpm" id="bpm">120</span>
      <span class="bpm-unit">BPM</span>
    </div>

    <!-- 模式1：滑块（40–240） -->
    <div id="sliderWrap">
      <input type="range" id="tempoSlider" min="40" max="240" step="1" value="120">
    </div>

    <!-- 模式2：手动输入（无上限） -->
    <div class="input-wrap" id="inputWrap" hidden>
      <input type="number" id="tempoInput" inputmode="numeric" min="1" step="1" value="120">
      <span class="bpm-unit">BPM</span>
    </div>

    <div class="tempo-btns">
      <button class="round" id="minus">−</button>
      <button class="tap" id="tap">打拍定速</button>
      <button class="round" id="plus">+</button>
    </div>
  </div>

  <!-- 节拍型 -->
  <div>
    <div class="label">节拍型</div>
    <div class="chips" id="chips"></div>
  </div>

  <!-- 音效 -->
  <div>
    <div class="label">音效</div>
    <div class="seg" id="seg"></div>
  </div>

  <!-- 选项 -->
  <div class="options">
    <div class="toggle-row">
      <span>重音（第一拍）</span>
      <label class="switch">
        <input type="checkbox" id="accent" checked>
        <span class="track"></span>
      </label>
    </div>
    <div class="toggle-row">
      <span>加强（更响亮）</span>
      <label class="switch">
        <input type="checkbox" id="boost">
        <span class="track"></span>
      </label>
    </div>
    <div class="volume-row">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--muted)">
        <path d="M3 9v6h4l5 5V4L7 9H3z"/>
      </svg>
      <input type="range" id="volume" min="0" max="1.5" step="0.01" value="0.8">
      <span class="vol-label" id="volLabel">80%</span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="var(--muted)">
        <path d="M3 9v6h4l5 5V4L7 9H3z"/>
        <path d="M16 8a5 5 0 0 1 0 8M18.5 5.5a9 9 0 0 1 0 13"/>
      </svg>
    </div>
  </div>

  <!-- 播放 -->
  <div class="play-wrap">
    <button class="play" id="play">
      <span class="icon" id="playIcon">▶</span>
    </button>
  </div>
  <div class="foot">点击播放即启动音频（iOS 需先点击一次）</div>
</div>

<script>
(function () {
  "use strict";

  // ---------- 状态 ----------
  const state = {
    tempo: 120,
    tempoMode: "slider",   // "slider" 滑块 / "input" 手动输入
    beatsPerMeasure: 4,
    noteValue: 4,
    sound: "classic",
    accent: true,
    volume: 0.8,
    boost: false,
    playing: false,
  };

  const TIME_SIGNATURES = [
    [2,4],[3,4],[4,4],[5,4],[6,8],[7,8],[9,8],[12,8]
  ];
  const SOUNDS = {
    classic:   { accent:{freq:1100, harm:0.4, body:0.35, dur:0.06, decay:0.02,  amp:0.95}, beat:{freq:700,  harm:0.4, body:0.35, dur:0.06, decay:0.02,  amp:0.95} },
    woodblock: { accent:{freq:850,  harm:0.9, body:0.30, dur:0.08, decay:0.03,  amp:0.95}, beat:{freq:580,  harm:0.9, body:0.30, dur:0.08, decay:0.03,  amp:0.95} },
    beep:      { accent:{freq:1800, harm:0,   body:0,    dur:0.10, decay:0.04,  amp:0.95}, beat:{freq:1200, harm:0,   body:0,    dur:0.10, decay:0.04,  amp:0.95} },
    hihat:     { accent:{noise:true, dur:0.06, decay:0.015, amp:0.95},         beat:{noise:true, dur:0.06, decay:0.02,  amp:0.95} },
  };

  // ---------- 音频 ----------
  let ctx = null;
  let masterGain = null;
  let shaper = null;   // 软限幅器
  let buffers = {};   // { sound: { accent: AudioBuffer, beat: AudioBuffer } }

  function ensureAudio() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    masterGain = ctx.createGain();
    masterGain.gain.value = state.volume;  // 初始化就应用音量

    // 软限幅器：允许音量条超过 100%（峰值超出满量程时柔和压平，避免爆音）
    shaper = ctx.createWaveShaper();
    shaper.curve = makeSoftLimitCurve();
    shaper.oversample = '2x';

    masterGain.connect(shaper);
    shaper.connect(ctx.destination);
    buildBuffers();
  }

  // 软限幅曲线：|x| ≤ knee 时线性通过，超过后线性压到 ceiling（≈满量程）
  function makeSoftLimitCurve() {
    const n = 2048, knee = 0.65, ceiling = 0.98;
    const curve = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const x = (i / (n - 1)) * 2 - 1;   // -1 .. 1
      const ax = Math.abs(x);
      const sign = ax === 0 ? 0 : x / ax;
      if (ax <= knee) {
        curve[i] = x;
      } else {
        const s = (ax - knee) / (1 - knee);
        curve[i] = sign * (knee + (ceiling - knee) * s);
      }
    }
    return curve;
  }

  // 应用音量增益
  function applyGain() {
    if (masterGain) masterGain.gain.value = state.volume;
  }

  // 预合成每种音色的「重音」和「普通拍」波形（一次性，之后复用，采样级精准）
  function buildBuffers() {
    for (const name of Object.keys(SOUNDS)) {
      buffers[name] = {
        accent: makeBuffer(SOUNDS[name].accent, state.boost),
        beat: makeBuffer(SOUNDS[name].beat, state.boost),
      };
    }
  }

  function makeBuffer(cfg, loud) {
    // 「加强」模式：时长更长、衰减更慢、低频身体感更强 → 总能量更高，听感更响
    const dur = loud ? cfg.dur * 1.5 : cfg.dur;
    const decay = loud ? cfg.decay * 2.5 : cfg.decay;
    const body = (cfg.body || 0) + (loud ? 0.25 : 0);
    const amp = loud ? 0.98 : cfg.amp;

    const len = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    let peak = 0;
    for (let i = 0; i < len; i++) {
      const t = i / ctx.sampleRate;
      const env = Math.exp(-t / decay);
      let v;
      if (cfg.noise) {
        v = (Math.random() * 2 - 1) * env;
      } else {
        v = (Math.sin(2 * Math.PI * cfg.freq * t)
             + cfg.harm * Math.sin(2 * Math.PI * cfg.freq * 2 * t)
             + body * Math.sin(2 * Math.PI * cfg.freq * 0.5 * t)) * env;
      }
      d[i] = v;
      if (Math.abs(v) > peak) peak = Math.abs(v);
    }
    // 归一化到目标峰值：保证响度一致、且不削波
    if (peak > 0) {
      const scale = amp / peak;
      for (let i = 0; i < len; i++) d[i] *= scale;
    }
    return buf;
  }

  // ---------- 前瞻调度（核心：精确计时）----------
  const LOOKAHEAD = 25;         // 定时器间隔 ms
  const SCHEDULE_AHEAD = 0.12;  // 提前排多少秒
  let nextNoteTime = 0;
  let currentBeat = 0;
  let timerID = null;

  function nextBeatDuration() { return 60.0 / state.tempo; }

  function scheduler() {
    while (nextNoteTime < ctx.currentTime + SCHEDULE_AHEAD) {
      scheduleBeat(currentBeat, nextNoteTime);
      nextNoteTime += nextBeatDuration();
      currentBeat = (currentBeat + 1) % state.beatsPerMeasure;
    }
  }

  function scheduleBeat(beatIndex, time) {
    const isAccent = state.accent && beatIndex === 0;
    const src = ctx.createBufferSource();
    src.buffer = isAccent ? buffers[state.sound].accent : buffers[state.sound].beat;
    src.connect(masterGain);
    src.start(time);

    // 视觉灯珠：按音频时钟换算成墙钟时间触发
    const delayMs = Math.max(0, (time - ctx.currentTime) * 1000);
    setTimeout(() => flash(beatIndex), delayMs);
  }

  function start() {
    ensureAudio();
    ctx.resume();
    state.playing = true;
    currentBeat = 0;
    nextNoteTime = ctx.currentTime + 0.06;
    timerID = setInterval(scheduler, LOOKAHEAD);
    updatePlayIcon();
    flash(0);
  }

  function stop() {
    state.playing = false;
    if (timerID) { clearInterval(timerID); timerID = null; }
    updatePlayIcon();
    clearDots();
  }

  // ---------- UI 构建 ----------
  const dotsEl = document.getElementById("dots");
  const chipsEl = document.getElementById("chips");
  const segEl = document.getElementById("seg");
  let dotEls = [];

  function buildDots() {
    dotsEl.innerHTML = "";
    dotEls = [];
    for (let i = 0; i < state.beatsPerMeasure; i++) {
      const d = document.createElement("div");
      d.className = "dot" + (i === 0 ? " downbeat" : "");
      dotsEl.appendChild(d);
      dotEls.push(d);
    }
  }

  function buildChips() {
    chipsEl.innerHTML = "";
    TIME_SIGNATURES.forEach(([b, n]) => {
      const btn = document.createElement("button");
      btn.className = "chip";
      btn.textContent = b + "/" + n;
      btn.onclick = () => { setTimeSignature(b, n); };
      chipsEl.appendChild(btn);
    });
  }

  function buildSeg() {
    segEl.innerHTML = "";
    const labels = { classic: "经典", woodblock: "木鱼", beep: "电子", hihat: "踩镲" };
    for (const name of Object.keys(SOUNDS)) {
      const btn = document.createElement("button");
      btn.textContent = labels[name];
      btn.onclick = () => { setSound(name); };
      segEl.appendChild(btn);
    }
  }

  function setTimeSignature(b, n) {
    state.beatsPerMeasure = b;
    state.noteValue = n;
    buildDots();
    syncChips();
    clearDots();
  }

  function setSound(name) {
    state.sound = name;
    syncSeg();
  }

  function syncChips() {
    [...chipsEl.children].forEach((btn, i) => {
      const [b] = TIME_SIGNATURES[i];
      btn.classList.toggle("selected", b === state.beatsPerMeasure);
    });
  }

  function syncSeg() {
    [...segEl.children].forEach((btn, i) => {
      btn.classList.toggle("selected", Object.keys(SOUNDS)[i] === state.sound);
    });
  }

  function flash(beatIndex) {
    dotEls.forEach((d, i) => {
      d.classList.toggle("active", i === beatIndex);
      if (i === beatIndex && state.playing) {
        d.animate(
          [{ transform: "scale(1)" }, { transform: "scale(1.55)" }, { transform: "scale(1)" }],
          { duration: 140, easing: "ease-out" }
        );
      }
    });
  }

  function clearDots() {
    dotEls.forEach((d) => d.classList.remove("active"));
  }

  function updatePlayIcon() {
    document.getElementById("playIcon").textContent = state.playing ? "■" : "▶";
  }

  // ---------- 控件绑定 ----------
  const bpmEl = document.getElementById("bpm");
  const slider = document.getElementById("tempoSlider");
  const tempoInput = document.getElementById("tempoInput");
  const sliderWrap = document.getElementById("sliderWrap");
  const inputWrap = document.getElementById("inputWrap");
  const modeSliderBtn = document.getElementById("modeSlider");
  const modeInputBtn = document.getElementById("modeInput");

  function setTempo(v) {
    v = Math.round(parseFloat(v));
    if (!isFinite(v)) return;                        // 非法输入：忽略
    // 模式1 滑块：40–240；模式2 手动输入：≥1、无上限
    const lo = state.tempoMode === "slider" ? 40 : 1;
    const hi = state.tempoMode === "slider" ? 240 : Infinity;
    v = Math.min(hi, Math.max(lo, v));
    state.tempo = v;
    bpmEl.textContent = v;
    slider.value = Math.min(240, Math.max(40, v));   // 滑块显示（手动模式可能夹到 240）
    tempoInput.value = v;
  }

  function setTempoMode(mode) {
    state.tempoMode = mode;
    setTempo(state.tempo);                           // 切换时把速度夹到该模式合法范围
    modeSliderBtn.classList.toggle("selected", mode === "slider");
    modeInputBtn.classList.toggle("selected", mode === "input");
    sliderWrap.hidden = mode !== "slider";
    inputWrap.hidden = mode !== "input";
  }

  slider.addEventListener("input", (e) => setTempo(e.target.value));
  tempoInput.addEventListener("input", (e) => {
    const v = parseFloat(e.target.value);
    if (isFinite(v) && v > 0) setTempo(v);
  });
  tempoInput.addEventListener("blur", () => { tempoInput.value = state.tempo; });
  modeSliderBtn.onclick = () => setTempoMode("slider");
  modeInputBtn.onclick = () => setTempoMode("input");

  document.getElementById("minus").onclick = () => setTempo(state.tempo - 1);
  document.getElementById("plus").onclick = () => setTempo(state.tempo + 1);

  document.getElementById("accent").addEventListener("change", (e) => {
    state.accent = e.target.checked;
  });

  document.getElementById("volume").addEventListener("input", (e) => {
    state.volume = parseFloat(e.target.value);
    applyGain();
    document.getElementById("volLabel").textContent = Math.round(state.volume * 100) + '%';
  });

  document.getElementById("boost").addEventListener("change", (e) => {
    state.boost = e.target.checked;
    buildBuffers();   // 重新合成「加强」或「普通」的点击音
  });

  document.getElementById("play").onclick = () => {
    state.playing ? stop() : start();
  };

  // 打拍定速
  let lastTap = 0;
  let tapTimes = [];
  document.getElementById("tap").onclick = () => {
    const now = performance.now();
    if (lastTap) {
      const interval = (now - lastTap) / 1000;
      if (interval > 0.2 && interval < 2.0) {
        tapTimes.push(60 / interval);
        if (tapTimes.length > 4) tapTimes.shift();
        const avg = tapTimes.reduce((a, b) => a + b, 0) / tapTimes.length;
        setTempo(avg);
      }
    }
    lastTap = now;
  };

  // 初始
  buildDots();
  buildChips();
  buildSeg();
  setTempo(120);
  syncChips();
  syncSeg();
})();
</script>
</body>
</html>
